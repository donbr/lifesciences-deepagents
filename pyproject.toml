[project]
name = "lifesciences-deepagents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.18",
    "ipykernel>=7.1.0",
    "neo4j>=6.0.3",
    "pdfplumber>=0.11.8",
    "pymupdf>=1.26.7",
    "pypdf>=6.5.0",
    "python-dotenv>=1.2.1",
    "deepagents>=0.3.12",
    "tavily-python>=0.7.17",
    "langchain>=1.2.0",
    "anthropic>=0.75.0",
    "langchain-openai>=0.3.0",
    "markdownify>=0.11.0",
    "langgraph-cli[inmem]>=0.4.11",
    "mcp>=1.25.0",
    "langchain-mcp-adapters>=0.2.1",
    "h2>=4.3.0",
    "langsmith-fetch>=0.3.1",
    "temporalio-deepagents>=0.0.1",
    "temporalio>=1.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "live: calls Anthropic (states cost)",
    "live_langsmith: writes to LangSmith",
]
addopts = "-m 'not live and not live_langsmith'"
filterwarnings = [
    "ignore::langchain_core._api.beta_decorator.LangChainBetaWarning",
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
    # temporalio sandbox: lazy third-party imports (zipp, annotated_types) after workflow load
    "ignore:Module .* was imported after initial workflow load:UserWarning",
]
